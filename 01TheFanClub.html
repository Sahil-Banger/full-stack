<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gaming Club - Sign Up</title>
</head>
<body>
    <div>
    <h1>The Gaming Club</h1>
    <h2>Welcome to the Club!</h2>
    <p>We are so excited to have you here to share our passion and connect with other amazing fans</p>
    </div>
    <form>
    <p>What is you username?</p>
    <input type="text" placeholder="Enter your username" required>
    <p>What is your primary gaming platform?</p>
    <label>
        <input type="radio" name="platform" value="pc">PC
    </label>
    <label>
        <input type="radio" name="platform" value="ps5">PS5
    </label>
    <label>
        <input type="radio" name="platform" value="xbox">XBOX
    </label>
    <p>Which video game genres do you play the most?:</p>
    <label>
        <input type="checkbox" name="genres" value="rpg & card games">RPG & Card Games
    </label>
    <label>
        <input type="checkbox" name="genres" value="action & adventure">Action & Adventure
    </label>
    <label>
        <input type="checkbox" name="genres" value="sport & football games">Sport & Football Games
    </label>
    <br><br>
    <button type="submit">Submit</button>
    </form>
</body>
</html>
