<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        h1{
            display: flex;
            padding: 40px;
            font-size: 4rem;
            font-family: Georgia, 'Times New Roman', Times, serif;
            justify-content: center;
            background-color: blueviolet;
            color: greenyellow;
            border-radius: 15px;
            border: 5px solid brown;
            margin: 30px 250px;
            
        }
        .gallery-container{
            display: grid;
            gap: 10px;
        }
        @media (min-width: 768px){
            .gallery-container{
                grid-template-columns: repeat(3, 1fr)
            }
        }
        .gallery-item{
            width: 100%;
            max-width: 500px;
            border: 5px solid black;
            height: 300px;
            overflow: hidden;
            margin: 0 auto;
        }
        .gallery-item img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
    </style>
</head>
<body>
    <h1>Wolf Tunnel</h1>
    <div class="gallery-container">
        <div class="gallery-item">
            <img src="imm/lupo1.png" alt="wolf">
        </div>
        <div class="gallery-item">
            <img src="imm/lupo2.png" alt="wolf">
        </div>
        <div class="gallery-item">
            <img src="imm/lupo3.png" alt="wolf">
        </div>
        <div class="gallery-item">
            <img src="imm/lupo4.png" alt="wolf">
        </div>
        <div class="gallery-item">
            <img src="imm/lupo5.png" alt="wolf">
        </div>
        <div class="gallery-item">
            <img src="imm/lupo6.png" alt="wolf">
        </div>
        <div class="gallery-item">
            <img src="imm/lupo7.png" alt="wolf">
        </div>
        <div class="gallery-item">
            <img src="imm/lupo8.png" alt="wolf">
        </div>
        <div class="gallery-item">
            <img src="imm/lupo9.png" alt="wolf">
        </div>
        <div class="gallery-item">
            <img src="imm/lupo10.png" alt="wolf">
        </div>
    </div>
    
</body>
</html>
